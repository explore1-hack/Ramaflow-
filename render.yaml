# Render "Blueprint": New + > Blueprint > pick your GitHub repo.
databases:
  - name: queuer-db
    plan: free

services:
  - type: web
    name: queuer
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: queuer-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: INVITE_CODE
        sync: false        # you type this value in the Render dashboard
